# SoundCheck Apple apps. Generate the Xcode project with:  cd apps/apple && xcodegen
name: SoundCheck
options:
  bundleIdPrefix: app.soundcheck
  deploymentTarget: { iOS: "18.0", tvOS: "18.0" }
  createIntermediateGroups: true
configFiles:
  Debug: Config/Debug.xcconfig
  Release: Config/Release.xcconfig
packages:
  SoundCheckKit: { path: SoundCheckKit }
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
targets:
  SoundCheckTV:
    type: application
    platform: tvOS
    sources: [SoundCheckTV]
    dependencies:
      - package: SoundCheckKit
        product: SoundCheckKit
      - package: SoundCheckKit
        product: SoundCheckUI
    info:
      path: SoundCheckTV/Info.plist
      properties:
        CFBundleDisplayName: SoundCheck
        UILaunchScreen: {}
        SoundCheckSupabaseURL: $(SC_SUPABASE_URL)
        SoundCheckSupabaseKey: $(SC_SUPABASE_KEY)
        SoundCheckSiteURL: $(SC_SITE_URL)
        NSAppTransportSecurity: { NSAllowsLocalNetworking: true }
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.soundcheck.tv
        TARGETED_DEVICE_FAMILY: "3"
        ASSETCATALOG_COMPILER_APPICON_NAME: App Icon & Top Shelf Image
  SoundCheckMobile:
    type: application
    platform: iOS
    sources: [SoundCheckMobile]
    dependencies:
      - package: SoundCheckKit
        product: SoundCheckKit
      - package: SoundCheckKit
        product: SoundCheckUI
    info:
      path: SoundCheckMobile/Info.plist
      properties:
        CFBundleDisplayName: SoundCheck
        UILaunchScreen: {}
        UIBackgroundModes: [audio]
        NSMicrophoneUsageDescription: SoundCheck listens to your singing to show your pitch and score you. Audio never leaves your phone; only pitch numbers are sent to the TV.
        NSCameraUsageDescription: Scan the QR code on the TV to join the party.
        CFBundleURLTypes:
          - CFBundleURLName: app.soundcheck.join
            CFBundleURLSchemes: [soundcheck]
        SoundCheckSupabaseURL: $(SC_SUPABASE_URL)
        SoundCheckSupabaseKey: $(SC_SUPABASE_KEY)
        SoundCheckSiteURL: $(SC_SITE_URL)
        NSAppTransportSecurity: { NSAllowsLocalNetworking: true }
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.soundcheck.mobile
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  SoundCheckMobileUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [SoundCheckMobileUITests]
    dependencies:
      - target: SoundCheckMobile
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.soundcheck.mobile.uitests
        TEST_TARGET_NAME: SoundCheckMobile
        GENERATE_INFOPLIST_FILE: YES
schemes:
  SoundCheckTV:
    build: { targets: { SoundCheckTV: all } }
    run: { config: Debug }
  SoundCheckMobile:
    build: { targets: { SoundCheckMobile: all } }
    run: { config: Debug }
    test: { config: Debug, targets: [SoundCheckMobileUITests] }
